name: Deploy Microsoft Foundry

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-foundry.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-foundry.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - DEV
          - DEV-STANDARD
          - STG
          - PROD
          - PROD-SECONDARY-REGION
      region:
        description: 'Optional Azure region override (e.g. westus2). Leave blank to use the region in the .bicepparam file / AZURE_LOCATION.'
        required: false
        type: string
      pruneOrphanedModels:
        description: 'DESTRUCTIVE: delete model deployments that exist in Azure but are no longer in the .bicepparam file. Leave unchecked to only report them.'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: deploy-foundry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Bicep - ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    # This repository targets the DEV subscription only. STG/PROD have no federated identity
    # credentials configured, so validating them here fails at Azure login rather than on any
    # real template problem. Add an entry below once an environment's credential exists.
    # `githubEnvironment` is the GitHub Environment used for secrets/OIDC; `name` selects the
    # parameter file (infra/<lowercased name>.main.bicepparam) -- DEV-STANDARD reuses DEV's
    # credential, mirroring the mapping in the deploy-manual job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DEV
            githubEnvironment: DEV
          - name: DEV-STANDARD
            githubEnvironment: DEV
    environment: ${{ matrix.githubEnvironment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install/upgrade Bicep CLI (via az cli)
        shell: bash
        run: |
          az bicep install
          az bicep upgrade
          az bicep version

      - name: Set environment name to lowercase
        shell: bash
        run: echo "ENV_LOWER=$(echo ${{ matrix.name }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Ensure resource group exists
        shell: bash
        run: |
          PARAM_FILE="./infra/${{ env.ENV_LOWER }}.main.bicepparam"
          RG=$(grep -oP "(?<=param resourceGroupName = ')[^']+" "$PARAM_FILE")
          LOC=$(grep -oP "(?<=param location = ')[^']+" "$PARAM_FILE")
          echo "Creating/verifying resource group '$RG' in '$LOC' (idempotent, no-op if it already exists)"
          az group create --name "$RG" --location "$LOC" --only-show-errors

      - name: Show deployment summary
        shell: bash
        run: |
          set -euo pipefail
          PARAM_FILE="./infra/${{ env.ENV_LOWER }}.main.bicepparam"

          # Read from the compiled parameter JSON rather than grepping the source, so the
          # commented-out field reference blocks in the .bicepparam aren't counted.
          P=$(az bicep build-params --file "$PARAM_FILE" --stdout | jq -r '.parametersJson')
          MODEL_COUNT=$(echo "$P" | jq '.parameters.foundryModelDeployments.value | length // 0')
          PROJECT_COUNT=$(echo "$P" | jq '.parameters.projects.value | length // 0')
          AGENT_SETUP=$(echo "$P" | jq -r '.parameters.agentSetupType.value // "Basic (default)"')
          APIGEE=$(echo "$P" | jq -r '.parameters.deployApigeeIntegration.value // false')
          ROLES=$(echo "$P" | jq -r '.parameters.deployRoleAssignments.value // false')

          echo "::group::Deployment plan - ${{ matrix.name }}"
          echo "Template:        ./infra/main.bicep"
          echo "Parameters file: $PARAM_FILE"
          echo "Region:          ${{ vars.AZURE_LOCATION || 'eastus' }}"
          echo "Agent setup:     $AGENT_SETUP"
          echo ""
          echo "Resources this template will create/update (Validate mode checks only, does not deploy):"
          echo "  - Microsoft Foundry account (Microsoft.CognitiveServices/accounts)"
          echo "  - $MODEL_COUNT Foundry model deployment(s)"
          echo "  - $PROJECT_COUNT Foundry project(s) + Application Insights connection"
          if [ "$AGENT_SETUP" = "Standard" ]; then
            echo "  - Standard Agent Setup backing resources: Key Vault, Storage account, Cosmos DB account, AI Search service"
            echo "  - Account + project-level Agents capability hosts"
          fi
          if [ "$APIGEE" = "true" ]; then
            echo "  - Apigee integration: Entra ID App Registration + Service Principal"
          fi
          echo "  - Role assignments: $ROLES"
          echo "::endgroup::"

      - name: Validate Bicep template
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          region: ${{ vars.AZURE_LOCATION || 'eastus' }}
          template: ./infra/main.bicep
          parameters: ./infra/${{ env.ENV_LOWER }}.main.bicepparam
          deploymentMode: Validate
          failOnStdErr: false

  deploy-manual:
    name: Manual Deploy - ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    # DEV-STANDARD reuses the DEV GitHub Environment's secrets/federated credential (same
    # subscription, same service principal) -- only the .bicepparam file differs. Add other
    # variants here (e.g. STG-STANDARD -> STG) if/when they're introduced.
    environment:
      name: ${{ github.event.inputs.environment == 'DEV-STANDARD' && 'DEV' || github.event.inputs.environment }}
      url: https://portal.azure.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install/upgrade Bicep CLI (via az cli)
        shell: bash
        run: |
          az bicep install
          az bicep upgrade
          az bicep version

      - name: Set environment name to lowercase
        shell: bash
        run: echo "ENV_LOWER=$(echo ${{ github.event.inputs.environment }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Determine deployment region
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.region }}" ]; then
            echo "DEPLOY_REGION=${{ github.event.inputs.region }}" >> $GITHUB_ENV
            echo "PARAM_OVERRIDES=location=${{ github.event.inputs.region }}" >> $GITHUB_ENV
          else
            echo "DEPLOY_REGION=${{ vars.AZURE_LOCATION || 'eastus' }}" >> $GITHUB_ENV
            echo "PARAM_OVERRIDES=" >> $GITHUB_ENV
          fi

      - name: Ensure resource group exists
        shell: bash
        run: |
          PARAM_FILE="./infra/${{ env.ENV_LOWER }}.main.bicepparam"
          RG=$(grep -oP "(?<=param resourceGroupName = ')[^']+" "$PARAM_FILE")
          LOC="${{ env.DEPLOY_REGION }}"
          echo "Creating/verifying resource group '$RG' in '$LOC' (idempotent, no-op if it already exists)"
          az group create --name "$RG" --location "$LOC" --only-show-errors
          echo "RESOURCE_GROUP=$RG" >> $GITHUB_ENV

      - name: Show deployment summary
        shell: bash
        run: |
          set -euo pipefail
          PARAM_FILE="./infra/${{ env.ENV_LOWER }}.main.bicepparam"

          # Read from the compiled parameter JSON rather than grepping the source, so the
          # commented-out field reference blocks in the .bicepparam aren't counted.
          P=$(az bicep build-params --file "$PARAM_FILE" --stdout | jq -r '.parametersJson')
          MODEL_COUNT=$(echo "$P" | jq '.parameters.foundryModelDeployments.value | length // 0')
          PROJECT_COUNT=$(echo "$P" | jq '.parameters.projects.value | length // 0')
          AGENT_SETUP=$(echo "$P" | jq -r '.parameters.agentSetupType.value // "Basic (default)"')
          APIGEE=$(echo "$P" | jq -r '.parameters.deployApigeeIntegration.value // false')
          ROLES=$(echo "$P" | jq -r '.parameters.deployRoleAssignments.value // false')
          DEPLOYMENT_NAME="foundry-${{ github.event.inputs.environment }}-${{ github.run_number }}"

          echo "::group::Deployment plan - ${{ github.event.inputs.environment }}"
          echo "Deployment name: $DEPLOYMENT_NAME"
          echo "Template:        ./infra/main.bicep"
          echo "Parameters file: $PARAM_FILE"
          echo "Resource group:  ${{ env.RESOURCE_GROUP }}"
          echo "Region:          ${{ env.DEPLOY_REGION }}"
          echo "Agent setup:     $AGENT_SETUP"
          echo ""
          echo "Resources this run will create/update:"
          echo "  - Microsoft Foundry account (Microsoft.CognitiveServices/accounts)"
          echo "  - $MODEL_COUNT Foundry model deployment(s)"
          echo "  - $PROJECT_COUNT Foundry project(s) + Application Insights connection"
          if [ "$AGENT_SETUP" = "Standard" ]; then
            echo "  - Standard Agent Setup backing resources: Key Vault, Storage account, Cosmos DB account, AI Search service"
            echo "  - Account + project-level Agents capability hosts"
          fi
          if [ "$APIGEE" = "true" ]; then
            echo "  - Apigee integration: Entra ID App Registration + Service Principal"
          fi
          echo "  - Role assignments: $ROLES"
          echo ""
          if [ "${{ github.event.inputs.pruneOrphanedModels }}" = "true" ]; then
            echo "Orphaned model deployments: WILL BE DELETED (pruneOrphanedModels = true)"
          else
            echo "Orphaned model deployments: report only (set pruneOrphanedModels to delete them)"
          fi
          echo "::endgroup::"

      - name: Deploy to Azure
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          region: ${{ env.DEPLOY_REGION }}
          template: ./infra/main.bicep
          parameters: ./infra/${{ env.ENV_LOWER }}.main.bicepparam ${{ env.PARAM_OVERRIDES }}
          deploymentName: 'foundry-${{ github.event.inputs.environment }}-${{ github.run_number }}'
          failOnStdErr: false

      - name: Reconcile model deployments
        shell: bash
        if: always() && steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          PARAM_FILE="./infra/${{ env.ENV_LOWER }}.main.bicepparam"
          PRUNE="${{ github.event.inputs.pruneOrphanedModels }}"

          # Compile the .bicepparam to JSON so the desired state is read from resolved
          # parameter values rather than by grepping source (which would also match the
          # commented-out field reference block). --stdout wraps the params file content
          # in a "parametersJson" string field, hence the extra jq unwrap below.
          PARAM_JSON=$(az bicep build-params --file "$PARAM_FILE" --stdout | jq -r '.parametersJson')
          FOUNDRY_NAME=$(echo "$PARAM_JSON" | jq -r '.parameters.foundryName.value')
          DESIRED=$(echo "$PARAM_JSON" | jq -r '.parameters.foundryModelDeployments.value[]?.name' | sort)

          ACTUAL=$(az cognitiveservices account deployment list \
            --name "$FOUNDRY_NAME" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[].name" -o tsv | sort)

          # Orphans = live in Azure but absent from the parameter file. Incremental
          # deployment mode never removes these, so they linger and keep consuming
          # the subscription's regional TPM quota until explicitly deleted.
          ORPHANS=$(comm -13 <(echo "$DESIRED") <(echo "$ACTUAL") | grep -v '^$' || true)

          echo "::group::Model deployment reconciliation - $FOUNDRY_NAME"
          echo "Desired (from $PARAM_FILE):"
          echo "$DESIRED" | sed 's/^/  - /'
          echo ""
          echo "Actual (live in Azure):"
          echo "$ACTUAL" | sed 's/^/  - /'
          echo "::endgroup::"

          if [ -z "$ORPHANS" ]; then
            echo "No orphaned model deployments - Azure matches the parameter file."
            echo "### Model deployments in sync :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ORPHAN_COUNT=$(echo "$ORPHANS" | wc -l | tr -d ' ')

          if [ "$PRUNE" = "true" ]; then
            echo "### Pruned $ORPHAN_COUNT orphaned model deployment(s) :wastebasket:" >> "$GITHUB_STEP_SUMMARY"
            while read -r NAME; do
              echo "Deleting orphaned model deployment '$NAME'..."
              az cognitiveservices account deployment delete \
                --name "$FOUNDRY_NAME" \
                --resource-group "${{ env.RESOURCE_GROUP }}" \
                --deployment-name "$NAME" \
                --only-show-errors
              echo "Deleted '$NAME'."
              echo "- \`$NAME\` deleted" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$ORPHANS"
          else
            echo "### $ORPHAN_COUNT orphaned model deployment(s) detected :warning:" >> "$GITHUB_STEP_SUMMARY"
            echo "These exist in Azure but are no longer in \`$PARAM_FILE\`. They still consume regional TPM quota." >> "$GITHUB_STEP_SUMMARY"
            echo "Re-run this workflow with **pruneOrphanedModels** checked to delete them, or remove them manually." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            while read -r NAME; do
              echo "::warning::Orphaned model deployment '$NAME' exists in Azure but is not in $PARAM_FILE. Delete with: az cognitiveservices account deployment delete --name $FOUNDRY_NAME --resource-group ${{ env.RESOURCE_GROUP }} --deployment-name $NAME"
              echo "- \`$NAME\`" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$ORPHANS"
          fi

      - name: List deployed resources
        shell: bash
        if: always() && steps.deploy.outcome == 'success'
        run: |
          DEPLOYMENT_NAME="foundry-${{ github.event.inputs.environment }}-${{ github.run_number }}"
          echo "::group::Resources created/updated by deployment '$DEPLOYMENT_NAME'"
          az deployment operation sub list \
            --name "$DEPLOYMENT_NAME" \
            --query "[?properties.targetResource!=null].{Resource:properties.targetResource.resourceType, Name:properties.targetResource.resourceName, Status:properties.provisioningState}" \
            -o table
          echo "::endgroup::"

          echo "::group::Resource group contents ('${{ env.RESOURCE_GROUP }}') after deployment"
          az resource list \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[].{Name:name, Type:type, Location:location}" \
            -o table
          echo "::endgroup::"

      - name: Output deployment results
        run: |
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Subscription: ${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          echo "Resource Group: ${{ steps.deploy.outputs.resourceGroupName }}"
          echo "Foundry Resource: ${{ steps.deploy.outputs.foundryName }}"
          echo "Foundry Resource ID: ${{ steps.deploy.outputs.foundryId }}"
          echo "Foundry Endpoint: ${{ steps.deploy.outputs.foundryEndpoint }}"
